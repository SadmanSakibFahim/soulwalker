- fragment_key: f_da_001
  pillar_tags: [the_watcher]
  rarity_weight: 1
  text: The boot by the door has not moved. You remember putting it there. You do not remember leaving it watching.
- fragment_key: f_da_002
  pillar_tags: [the_hollow_hour]
  rarity_weight: 1
  text: The bell on the hook does not ring. It has the posture of something that already has.
- fragment_key: f_da_003
  pillar_tags: [the_second_face]
  rarity_weight: 1
  text: The doorway stayed open overnight. In the morning the gap is the same width, as if the house is holding a thought.
- fragment_key: f_da_004
  pillar_tags: [the_weight]
  rarity_weight: 1
  text: An invitation lies on the table, face-down. The paper is warm. Nobody has come to collect an answer.
- fragment_key: f_da_005
  pillar_tags: [the_hollow_hour]
  rarity_weight: 1
  text: The clock agrees it is later than it was. It will not say how much later. The hands look tired of being asked.
- fragment_key: f_da_006
  pillar_tags: [the_second_face]
  rarity_weight: 1
  text: The second pillow has a dent. You live alone. The dent is polite about it.
- fragment_key: f_da_007
  pillar_tags: [the_watcher]
  rarity_weight: 1
  text: Condensation on the window has arranged itself into a shape that could be a palm, if you were willing to be that kind of person.
- fragment_key: f_da_008
  pillar_tags: [the_weight]
  rarity_weight: 1
  text: The coat on the peg is heavier than cloth. You try it on anyway. Your shoulders remember a pressure that is not weather.
- fragment_key: f_da_009
  pillar_tags: [the_long_blink]
  rarity_weight: 1
  text: The kettle clicked off some time ago. The steam is still deciding whether to be a cloud or a minute.
- fragment_key: f_da_010
  pillar_tags: [the_watcher]
  rarity_weight: 1
  text: The hallway light is on because you left it on. That is the story you are using. The bulb hums like it is keeping count.
- fragment_key: f_da_011
  pillar_tags: [the_second_face]
  rarity_weight: 1
  text: An unopened letter has your name spelled correctly, which is worse. The handwriting is almost someone you know.
- fragment_key: f_da_012
  pillar_tags: [the_weight]
  rarity_weight: 1
  text: A pair of gloves sits palms-up on the stair. They are empty in a way that feels practiced.
- fragment_key: f_da_013
  pillar_tags: [the_long_blink]
  rarity_weight: 1
  text: The stairs do not creak. You wait for the sound that should have happened three steps ago. It arrives as a thought, not a noise.
- fragment_key: f_da_014
  pillar_tags: [the_hollow_hour]
  rarity_weight: 1
  text: The cup is still warm. You did not pour it. You drink anyway, because motion is how the morning agrees you are here.
