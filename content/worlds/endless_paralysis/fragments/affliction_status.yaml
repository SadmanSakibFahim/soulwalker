  pillar_tags: [the_watcher]
  rarity_weight: 1
  text: An affliction named is an affliction seated. The Watcher stays, but the timer is polite enough to wait.
- fragment_key: f_af_003
  trigger_value: 1
  pillar_tags: [the_hollow_hour]
  rarity_weight: 1
  text: The Hollow Hour does not break the streak. It holds it the way a closed door holds a room.
- fragment_key: f_af_004
