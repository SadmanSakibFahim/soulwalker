[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulwalker"
version = "0.1.0"
description = "Soulwalker API — world-agnostic fitness mythos backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyyaml>=6.0.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-python-jose>=3.3.4",
]

[project.scripts]
soulwalker = "soulwalker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["INP"]
"tests/**" = ["N802", "ASYNC240"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["soulwalker"]
exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: hits Postgres and the real API stack",
]
