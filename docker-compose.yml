services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soulwalker
      POSTGRES_PASSWORD: soulwalker
      POSTGRES_DB: soulwalker
    ports:
      - "5433:5432"
    volumes:
      - soulwalker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulwalker -d soulwalker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soulwalker_pgdata:
